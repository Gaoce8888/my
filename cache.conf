######################################
# 缓存配置 (cache.conf)
# 用于优化API和静态资源的缓存策略
######################################

###################
# 缓存路径设置
###################

# 定义静态文件缓存
# levels=1:2 表示两级目录深度，提高文件系统性能
# keys_zone=static_cache:10m 为缓存区域分配10MB共享内存
# max_size=1g 限制缓存最大容量为1GB
# inactive=60m 如果60分钟内未被访问，缓存将被清除
# use_temp_path=off 直接写入缓存目录，而不是临时目录
proxy_cache_path /var/cache/nginx/static levels=1:2 
    keys_zone=static_cache:10m
    max_size=1g
    inactive=60m
    use_temp_path=off;

# 定义API响应缓存
# 对于频繁请求但变化不大的API响应
proxy_cache_path /var/cache/nginx/api levels=1:2
    keys_zone=api_cache:10m
    max_size=500m
    inactive=10m
    use_temp_path=off;

# 定义微缓存（用于实时性要求较高的API）
# 缓存时间非常短，主要用于减轻后端压力，防止穿透
proxy_cache_path /var/cache/nginx/microcache levels=1:2
    keys_zone=microcache:10m
    max_size=100m
    inactive=1m
    use_temp_path=off;

# 设置缓存键
# 包含请求方法、主机名和URI，以区分不同请求
proxy_cache_key "$request_method$host$request_uri";

# 设置缓存锁
# 当多个相同请求同时到达时，只允许一个请求到达后端
# 其他请求等待第一个请求的结果
proxy_cache_lock on;
proxy_cache_lock_timeout 5s;

# 设置缓存后台进程
# 缓存清理、更新等操作在后台线程中进行
proxy_cache_background_update on;

###################
# 静态资源缓存配置
###################

# 图片、JavaScript、CSS等静态资源缓存
location ~* \.(jpg|jpeg|png|gif|ico|svg|webp|js|css|ttf|woff|woff2|eot)$ {
    # 使用静态资源缓存区
    proxy_cache static_cache;
    
    # 定义哪些响应码的请求可以被缓存，以及缓存时间
    proxy_cache_valid 200 302 304 7d;  # 正常响应缓存7天
    proxy_cache_valid 404 1h;          # 404错误缓存1小时
    
    # 设置最少使用次数后缓存
    # 仅当资源被请求至少1次后才缓存
    proxy_cache_min_uses 1;
    
    # 启用缓存重新验证
    # 当缓存过期时，发送If-Modified-Since头验证
    proxy_cache_revalidate on;
    
    # 添加缓存状态头
    add_header X-Cache-Status $upstream_cache_status;
    
    # 浏览器缓存设置
    expires 7d;
    add_header Cache-Control "public, max-age=604800";
    
    # 带版本号的资源使用更长的缓存时间（适用于指纹哈希文件名）
    # 例如 main.a1b2c3d4.js 这种带哈希的资源文件
    if ($request_filename ~* "^.+\.[a-f0-9]{8,}\.[a-z]+$") {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    
    # 日志配置（可选择减少日志量）
    access_log off;
}

###################
# API缓存配置
###################

# API缓存示例 - 适用于aa.ylqkf.com.conf中的API路由
# 放置在location /api/ 内

# 通用API缓存设置
proxy_cache api_cache;
proxy_cache_methods GET HEAD;  # 仅缓存GET和HEAD请求
proxy_cache_valid 200 5m;      # 成功响应缓存5分钟
proxy_cache_valid 404 1m;      # 404错误缓存1分钟
proxy_cache_lock on;           # 防止缓存风暴
add_header X-Cache-Status $upstream_cache_status;  # 添加缓存状态头

# 允许通过请求头控制缓存行为
proxy_cache_bypass $http_pragma $http_authorization;  # 带认证或pragma头不缓存

# 大型响应不缓存
proxy_no_cache $request_body_file;  # 请求带文件体不缓存

###################
# 特定API缓存例子
###################

# 1. 客服绩效统计API缓存（数据变化不频繁）
location ~* ^/api/agents/performance {
    proxy_pass http://backend:3000;
    
    # 使用API缓存区
    proxy_cache api_cache;
    
    # 缓存策略
    proxy_cache_methods GET;
    proxy_cache_valid 200 10m;  # 成功响应缓存10分钟
    proxy_cache_min_uses 1;     # 至少被请求1次才缓存
    
    # 缓存控制
    proxy_cache_lock on;
    proxy_cache_lock_timeout 5s;
    
    # 缓存键包含查询参数
    proxy_cache_key "$request_method$host$request_uri$is_args$args";
    
    # 添加缓存状态头
    add_header X-Cache-Status $upstream_cache_status;
    
    # 传递常规代理头
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
}

# 2. 健康检查API微缓存（频繁访问但需要较新数据）
location ~* ^/api/health {
    proxy_pass http://backend:3000;
    
    # 使用微缓存区
    proxy_cache microcache;
    
    # 短暂缓存策略
    proxy_cache_methods GET;
    proxy_cache_valid 200 10s;  # 仅缓存10秒
    proxy_cache_valid any 0;    # 不缓存其他响应
    
    # 快速响应配置
    proxy_read_timeout 1s;
    proxy_connect_timeout 1s;
    
    # 添加缓存状态头
    add_header X-Cache-Status $upstream_cache_status;
}

# 3. 免缓存区域（实时性要求高的API）
location ~* ^/api/(customer/|sessions/|messages/) {
    proxy_pass http://backend:3000;
    
    # 禁用缓存
    proxy_no_cache 1;
    proxy_cache_bypass 1;
    
    # 设置不缓存的响应头
    add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
    expires -1;
    
    # 传递常规代理头
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
}

###################
# 缓存清理策略
###################

# 缓存清理API（内部使用）
# 允许管理员通过API调用清除特定缓存
location ~* ^/admin/cache/clear/(.+)$ {
    # 内部访问限制
    allow 127.0.0.1;
    allow 192.168.0.0/24;  # 内部网络
    deny all;
    
    # 提取要清除的缓存区域参数
    set $cache_zone $1;
    
    # 根据参数执行不同的缓存清除操作
    if ($cache_zone = "static") {
        proxy_cache_purge static_cache "$request_method$host$request_uri";
    }
    
    if ($cache_zone = "api") {
        proxy_cache_purge api_cache "$request_method$host$request_uri";
    }
    
    if ($cache_zone = "all") {
        # 对于所有缓存区域的完全清除，需要重新加载Nginx
        # 此处仅返回提示信息
        return 200 "提示: 完全清除所有缓存需要重新加载Nginx配置。请使用: nginx -s reload";
    }
    
    # 默认返回成功
    return 200 "Cache zone $cache_zone purged successfully";
}

###################
# 高级缓存技巧
###################

# 1. 使用分布式缓存
# 对于大规模部署，考虑使用Redis或Memcached作为分布式缓存
# 示例：使用Nginx Plus的外部缓存存储功能，或使用第三方模块

# 2. 设置缓存清理计划任务
# 在系统负载低的时候执行定期缓存清理
# crontab示例：
# 0 3 * * * find /var/cache/nginx/static -type f -mtime +7 -delete

# 3. 监控缓存命中率
# 在日志中记录缓存状态，然后使用日志分析工具监控
# 示例：在access_log格式中添加$upstream_cache_status

# 4. 缓存分片
# 对于大型网站，可以根据内容类型或URL路径拆分缓存
# 这样可以更好地管理缓存大小和过期策略
