[package]
name = "customer-service-chat"
version = "0.1.0"
edition = "2021"
default-run = "simple"

[dependencies]
# 核心框架
axum = { version = "0.6", features = ["ws", "headers"] }
tokio = { version = "1", features = ["full"] }
tower = "0.4"
tower-http = { version = "0.4", features = ["cors", "fs"] }
tokio-util = { version = "0.7", features = ["io"] }
futures = "0.3"

# 序列化与反序列化
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# 数据库
sqlx = { version = "0.7", features = ["runtime-tokio-native-tls", "postgres", "chrono", "uuid", "json"] }
redis = { version = "0.23", features = ["tokio-comp", "connection-manager"] }

# 工具库
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.3", features = ["v4", "serde"] }
async-trait = "0.1"
async-stream = "0.3"
tracing = "0.1"
tracing-subscriber = "0.3"
dotenv = "0.15"

# 错误处理
thiserror = "1.0"
anyhow = "1.0"

# API文档
utoipa = { version = "4.1", features = ["axum_extras", "chrono", "uuid"] }
utoipa-swagger-ui = { version = "5.0", features = ["axum"] }

# 其他工具
rand = "0.8"
reqwest = { version = "0.11", features = ["json"] }
jsonwebtoken = "8.3"
toml = "0.7"
argon2 = { version = "0.5", features = ["std"] }
password-hash = { version = "0.5", features = ["rand_core"] }
rand_core = "0.6"
base64 = "0.13.0"
flate2 = "1.0.24"

[[bin]]
name = "simple"
path = "src/bin/simple.rs"

[[bin]]
name = "client"
path = "src/bin/client.rs"
