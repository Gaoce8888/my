######################################
# 客户端界面配置 (cc.ylqkf.com.conf)
# 用于客户访问的聊天前端界面
######################################

# HTTP服务器 - 将所有HTTP请求重定向到HTTPS
server {
    # 监听所有IPv4地址的80端口
    listen 80;
    
    # 监听所有IPv6地址的80端口
    listen [::]:80;
    
    # 服务器名称
    server_name cc.ylqkf.com;
    
    # 访问日志和错误日志
    access_log /var/log/nginx/cc_http_access.log main;
    error_log /var/log/nginx/cc_http_error.log warn;
    
    # HTTP重定向到HTTPS
    return 301 https://$host$request_uri;
}

# HTTPS服务器
server {
    # 监听所有IPv4地址的443端口，启用SSL和HTTP/2
    listen 443 ssl http2;
    
    # 监听所有IPv6地址的443端口，启用SSL和HTTP/2
    listen [::]:443 ssl http2;
    
    # 服务器名称
    server_name cc.ylqkf.com;
    
    # 访问日志和错误日志
    access_log /var/log/nginx/cc_access.log main;
    error_log /var/log/nginx/cc_error.log warn;

    ###################
    # SSL配置
    ###################
    
    # SSL证书路径
    ssl_certificate /etc/nginx/ssl/ylqkf.com.crt;
    
    # SSL私钥路径
    ssl_certificate_key /etc/nginx/ssl/ylqkf.com.key;
    
    # 启用的SSL协议版本
    ssl_protocols TLSv1.2 TLSv1.3;
    
    # 优先使用服务器的密码套件顺序
    ssl_prefer_server_ciphers on;
    
    # 指定使用的密码套件
    ssl_ciphers 'EECDH+AESGCM:EDH+AESGCM:AES256+EECDH:AES256+EDH';
    
    # SSL会话缓存配置
    ssl_session_cache shared:SSL:10m;
    
    # SSL会话的超时时间
    ssl_session_timeout 1d;
    
    # 启用OCSP Stapling
    ssl_stapling on;
    ssl_stapling_verify on;
    
    # 启用HSTS
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    ###################
    # 静态文件服务
    ###################
    
    # 设置网站根目录，客户端界面的静态文件位置
    root /var/www/ylqkf/client;
    
    # 默认首页文件
    index index.html;
    
    # 设置客户端上传限制
    # 客户可能上传图片等内容
    client_max_body_size 10M;

    ###################
    # 前端路由支持
    ###################
    
    # 处理前端路由（单页应用SPA）
    location / {
        # 尝试寻找请求的URI文件；如果不存在，则尝试目录；如果都不存在，返回index.html
        try_files $uri $uri/ /index.html;
        
        # 缓存控制，设置较短的缓存时间
        # 客户端界面可能频繁更新
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
        
        # 安全头部
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        
        # 支持跨域嵌入（如果需要在其他网站嵌入客服系统）
        # add_header X-Frame-Options "ALLOW-FROM https://example.com" always;
    }

    ###################
    # 静态资源缓存
    ###################
    
    # 静态资源（较长缓存时间）
    location /assets/ {
        # 设置较长的缓存时间（7天）
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        
        # 启用gzip压缩
        gzip_static on;
        
        # 添加跨域头（如果需要）
        add_header Access-Control-Allow-Origin "*";
    }
    
    # 长期缓存带版本号的静态资源
    # 例如：main.a1b2c3d4.js
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        # 检查文件名是否包含哈希值
        if ($request_filename ~* "^.+\.[a-f0-9]{8,}\.[a-z]+$") {
            # 1年缓存
            expires 1y;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }
        
        # 正常的静态资源缓存
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    ###################
    # API反向代理
    ###################
    
    # 将API请求代理到API服务器
    location /api/ {
        # 代理到API服务器
        proxy_pass https://aa.ylqkf.com/api/;
        
        # 设置HTTP版本
        proxy_http_version 1.1;
        
        # 设置主机头为API服务器域名
        proxy_set_header Host aa.ylqkf.com;
        
        # 传递客户端信息
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # 默认超时时间
        proxy_read_timeout 60s;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
    }

    ###################
    # 特殊API路由
    ###################
    
    # 离线消息获取专用路由 - 添加更长的超时时间
    # 因为获取大量离线消息可能需要更长的处理时间
    location /api/customer/ {
        proxy_pass https://aa.ylqkf.com/api/customer/;
        
        # 设置主机头为API服务器域名
        proxy_set_header Host aa.ylqkf.com;
        
        # 传递客户端信息
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # 更长的超时时间
        proxy_read_timeout 120s;  # 读取超时
        proxy_connect_timeout 60s;  # 连接超时
        proxy_send_timeout 60s;  # 发送超时
    }

    ###################
    # WebSocket反向代理
    ###################
    
    # WebSocket连接代理
    location /api/ws {
        # 代理到API服务器的WebSocket端点
        proxy_pass https://aa.ylqkf.com/api/ws;
        
        # WebSocket需要的设置
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        # 传递主机和客户端信息
        proxy_set_header Host aa.ylqkf.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        
        # WebSocket超时设置（需要较长的超时保持连接）
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_connect_timeout 75s;
        
        # 允许WebSocket保持长连接
        proxy_buffer_size 64k;
        proxy_buffers 8 32k;
    }

    ###################
    # 安全设置
    ###################
    
    # 安全头部设置
    # 允许来自trusted.example.com的内联和脚本执行（如果需要嵌入到其他网站）
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self' wss://aa.ylqkf.com;" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    
    # 禁止访问隐藏文件
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
    
    # 限制HTTP方法
    if ($request_method !~ ^(GET|POST|PUT|DELETE|OPTIONS)$) {
        return 405;
    }
    
    # 启用CORS（允许跨域，适用于嵌入式客服系统）
    # 这对于从其他网站访问客服系统很重要
    add_header Access-Control-Allow-Origin "*";
    add_header Access-Control-Allow-Methods "GET, POST, OPTIONS";
    add_header Access-Control-Allow-Headers "DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization";
    add_header Access-Control-Expose-Headers "Content-Length,Content-Range";
    
    # 处理 CORS 预检请求
    if ($request_method = 'OPTIONS') {
        add_header Access-Control-Allow-Origin "*";
        add_header Access-Control-Allow-Methods "GET, POST, OPTIONS";
        add_header Access-Control-Allow-Headers "DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization";
        add_header Access-Control-Max-Age "1728000";  # 20天
        add_header Content-Type "text/plain charset=UTF-8";
        add_header Content-Length "0";
        return 204;
    }

    ###################
    # 性能优化
    ###################
    
    # 启用压缩
    gzip on;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    
    # 预加载GZIP文件
    gzip_static on;
    
    # 设置浏览器缓存
    etag on;
    
    # 错误页面处理
    error_page 404 /index.html;
    error_page 500 502 503 504 /50x.html;

    ###################
    # 聊天测试工具
    ###################
    
    # 提供WebSocket聊天测试工具
    location /websocket-test.html {
        # 可以访问但不缓存测试工具
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
    }
}
